# Local infrastructure for development: docker compose up -d starts Redis, Kafka and Mailpit.
# The services run outside Docker then (IntelliJ, ./mvnw), with the MySQL installed on this machine.
# The profile "app" adds MySQL and the eight services, the whole stack in containers:
#   docker compose --profile app up -d --build
# Passwords and keys come from .env (see .env.example).

# Settings shared by the services
x-service: &service
  profiles: ["app"]
  # Started again if it stops, unless stopped on purpose (docker compose stop)
  restart: unless-stopped
  # Time between the stop signal and a forced kill. A service needs about 6 s to finish its requests and leave
  # Eureka; killed before that, it stays in the registry until its lease expires and callers keep picking it.
  # Set explicitly: Docker Desktop 29.3 killed containers 1.5-2 s after docker stop by default
  stop_grace_period: 30s

# Each service reads only the variables it uses
x-service-env: &service-env
  EUREKA_URL: http://service-discovery:8761/eureka/
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  REDIS_HOST: redis
  # Clients reach everything through the API gateway, so its address is the tokens' issuer and the base of the links
  # the services hand out (password reset, payment pages)
  AUTH_ISSUER: ${PUBLIC_URL:-http://localhost:8000}

# A service is healthy when its Actuator health is UP. start_period: the first start of all the services at once
# takes a while, failures then do not count
x-health: &health
  interval: 10s
  timeout: 3s
  retries: 3
  start_period: 120s
  start_interval: 2s

services:
  # The services' databases for the containerized stack: one server, a database and a user per service, created by
  # infrastructure/mysql/init on the first start. MySQL 8.4 is the long-term support release (8.0 ended in April 2026)
  mysql:
    image: mysql:8.4
    profiles: ["app"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
      PRODUCT_DB_PASSWORD: ${PRODUCT_DB_PASSWORD:-}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:-}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:-}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:-}
    ports:
      # For a database client on this machine; the services use mysql:3306 inside the network.
      # 3307, because a MySQL installed on this machine usually has 3306
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infrastructure/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP: while the init scripts run, MySQL accepts only local socket connections, so this stays unhealthy
      # until the databases and users exist
      test: ["CMD", "mysqladmin", "ping", "--host=127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    # appendonly: every change is also written to a log on disk (flushed once a second), so carts, which live only
    # in Redis, survive a restart of the container. The product cache would not need it: it is refilled from MySQL.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # Reachable from this machine only, not from the network
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # One Kafka broker in KRaft mode: it is its own controller, so no ZooKeeper is needed
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two addresses for clients: localhost:9092 for services running on this machine, kafka:29092 for services in
      # containers. A client first asks any address for the broker list, then connects to the address advertised for
      # the listener it came in on, so each kind of client is told an address it can reach
      KAFKA_LISTENERS: PLAINTEXT://:9092,DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # One broker, so every internal topic has one copy
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are declared by the services that own them, never created by a typo in a topic name
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Topics and events are kept in the kafka-data volume, so they survive a new container. Without this setting
      # Kafka writes to /tmp/kafka-logs inside the container, which is lost when the container is recreated
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 10

  # A mail catcher for development: accepts every email over SMTP (port 1025) and shows it in a web page
  # (http://localhost:8025) instead of delivering it. On AWS the same SMTP settings point at Amazon SES.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  # --- The services (profile app). Only the API gateway, the Eureka dashboard and Mailpit's page are published, on
  # --- this machine only; the services reach each other by name inside the network

  service-discovery:
    <<: *service
    build: ./service-discovery
    image: vanmool/service-discovery
    ports:
      # The Eureka dashboard: which instances are registered
      - "127.0.0.1:8761:8761"
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8761/actuator/health"]

  user-auth-service:
    <<: *service
    build: ./user-auth-service
    image: vanmool/user-auth-service
    environment:
      <<: *service-env
      DB_URL: jdbc:mysql://mysql:3306/user_db
      DB_USERNAME: UserAuthService_user
      DB_PASSWORD: ${USER_DB_PASSWORD:-}
      # The key that signs tokens. Without it a new one is made at every start, and a restart ends every session
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
    depends_on: &needs-mysql-kafka
      mysql: { condition: service_healthy }
      kafka: { condition: service_healthy }
      service-discovery: { condition: service_healthy }
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8081/actuator/health"]

  product-service:
    <<: *service
    build: ./product-service
    image: vanmool/product-service
    environment:
      <<: *service-env
      DB_URL: jdbc:mysql://mysql:3306/product_db
      DB_USERNAME: ProductService_user
      DB_PASSWORD: ${PRODUCT_DB_PASSWORD:-}
    depends_on:
      mysql: { condition: service_healthy }
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }
      service-discovery: { condition: service_healthy }
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/actuator/health"]

  cart-service:
    <<: *service
    build: ./cart-service
    image: vanmool/cart-service
    environment:
      <<: *service-env
    depends_on:
      redis: { condition: service_healthy }
      service-discovery: { condition: service_healthy }
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8082/actuator/health"]

  order-service:
    <<: *service
    build: ./order-service
    image: vanmool/order-service
    environment:
      <<: *service-env
      DB_URL: jdbc:mysql://mysql:3306/order_db
      DB_USERNAME: OrderService_user
      DB_PASSWORD: ${ORDER_DB_PASSWORD:-}
    depends_on: *needs-mysql-kafka
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8083/actuator/health"]

  payment-service:
    <<: *service
    build: ./payment-service
    image: vanmool/payment-service
    environment:
      <<: *service-env
      DB_URL: jdbc:mysql://mysql:3306/payment_db
      DB_USERNAME: PaymentService_user
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD:-}
      # The customer's browser is sent to the payment pages through the API gateway
      PAYMENT_PUBLIC_BASE_URL: ${PUBLIC_URL:-http://localhost:8000}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # Off unless .env turns it on: anyone could mark payments paid with it
      PAYMENT_FAKE_GATEWAY_ENABLED: ${PAYMENT_FAKE_GATEWAY_ENABLED:-false}
      # Its webhook comes in through the API gateway, like a real gateway's
      PAYMENT_FAKE_WEBHOOK_URL: http://api-gateway:8000/payments/webhooks/fake
    depends_on: *needs-mysql-kafka
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8085/actuator/health"]

  # No HTTP port, so no health check: it only reads Kafka and sends email
  notification-service:
    <<: *service
    build: ./notification-service
    image: vanmool/notification-service
    environment:
      <<: *service-env
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    depends_on:
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }
      mailpit: { condition: service_started }

  api-gateway:
    <<: *service
    build: ./api-gateway
    image: vanmool/api-gateway
    environment:
      <<: *service-env
    ports:
      # The one address clients use
      - "127.0.0.1:8000:8000"
    depends_on:
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      service-discovery: { condition: service_healthy }
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8000/actuator/health"]

volumes:
  mysql-data:
  redis-data:
  kafka-data:
