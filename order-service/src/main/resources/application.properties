spring.application.name=order-service

# 8083 locally, next to product-service (8080), user-auth-service (8081) and cart-service (8082).
# In Docker or on AWS, the SERVER_PORT environment variable overrides it.
server.port=8083

# Database connection, read from environment variables (see .env.example).
# The defaults point at a local MySQL; a real password never goes in this file.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/order_db}
spring.datasource.username=${DB_USERNAME:OrderService_user}
spring.datasource.password=${DB_PASSWORD:}
# Wait at most 2 s for a database connection (Hikari's default is 30 s). When MySQL is unreachable, a request then
# gets 503 after about 2 s instead of 500 after 30 s, well within the API gateway's 10 s
spring.datasource.hikari.connection-timeout=2000
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway owns the schema: at startup it applies any new script in db/migration.
# Hibernate only checks that the tables match the entities, and stops the app if they don't.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# The Hibernate session closes when the service returns; lazy data cannot be loaded by accident in a controller
spring.jpa.open-in-view=false

# Order history pages: at most 50 orders per page, sent as { "content": [...], "page": {...} }
spring.data.web.pageable.max-page-size=50
spring.data.web.pageable.serialization-mode=via-dto

# Tokens come from user-auth-service and are checked here with its public keys, issuer and expiry
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER:http://localhost:8081}
# The public keys are fetched by service name, through Eureka (JwtDecoderConfig)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWKS_URI:http://user-auth-service/oauth2/jwks}

# The services an order is placed with: cart-service for what the customer chose, product-service to reserve the
# stock (and get the prices). A reservation can wait briefly for other orders of the same products, hence 3 s
# Service names, resolved through Eureka (see below)
cart-service.url=${CART_SERVICE_URL:http://cart-service}
product-service.url=${PRODUCT_SERVICE_URL:http://product-service}
remote-services.connect-timeout=1s
remote-services.read-timeout=3s

# Kafka (docker compose up -d kafka). Events go out through the outbox table; acks=all waits until the broker has
# stored each one. Short timeouts, so the relay notices quickly when Kafka is down and tries again a second later
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.admin.operation-timeout=10s
# How often the relay looks for unsent events, and how long sent ones are kept
outbox.relay-interval=PT1S
outbox.retention=P7D
# payment-events are read as the consumer group "order-service", from the beginning on its first start
spring.kafka.consumer.group-id=order-service
spring.kafka.consumer.auto-offset-reset=earliest

# An order not paid within this time is cancelled and its stock released. Longer than a payment link's validity
# (30 minutes in payment-service), so an open link always belongs to an open order
order.payment-window=${ORDER_PAYMENT_WINDOW:PT60M}

# Service discovery (Day 223). The service registers with Eureka as ORDER-SERVICE (spring.application.name)
# and finds the services it calls by name. Its address in the registry is its IP address, which also works inside
# Docker.
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
# The instance's status in Eureka follows its health: with its database down it is DOWN, and gets no traffic
eureka.client.healthcheck.enabled=true
# Only health and info are published; the other actuator endpoints (environment, heap dump) would give too much away
management.endpoints.web.exposure.include=health,info

# Heartbeat every 10 s, removed after missing them for 30 s (the defaults are 30 s and 90 s), a change of health
# reported within 10 s (default 30 s), and the registry read again every 10 s, as the load balancer's own copy
# (defaults 30 s and 35 s): a crashed or unhealthy instance is left out sooner, and a new or recovered one gets work
# sooner, for a few more small requests
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30
eureka.client.instance-info-replication-interval-seconds=10
eureka.client.registry-fetch-interval-seconds=10
spring.cloud.loadbalancer.cache.ttl=10s

# Until a crashed instance is removed, the load balancer can still pick it. A call that fails on the instance it chose
# is tried once more on another one (Spring Retry), so callers do not see the crash. Every call order-service makes
# is safe to repeat: reading the cart, emptying it, and reserving or releasing stock, which product-service keys by
# the order id (a repeated reservation returns the first)
spring.cloud.loadbalancer.retry.max-retries-on-same-service-instance=0
spring.cloud.loadbalancer.retry.max-retries-on-next-service-instance=1
spring.cloud.loadbalancer.retry.retry-on-all-operations=true
