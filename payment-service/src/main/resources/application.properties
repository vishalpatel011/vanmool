spring.application.name=payment-service

# 8085 locally (8084 is left free). In Docker or on AWS, the SERVER_PORT environment variable overrides it.
server.port=8085

# Database connection, read from environment variables (see .env.example).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/payment_db}
spring.datasource.username=${DB_USERNAME:PaymentService_user}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Tokens come from user-auth-service and are checked here with its public keys, issuer and expiry
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER:http://localhost:8081}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWKS_URI:http://localhost:8081/oauth2/jwks}

# order-service, asked for the order's amount and status when a payment starts (with the customer's token)
# A service name, resolved through Eureka (see below)
order-service.url=${ORDER_SERVICE_URL:http://order-service}
remote-services.connect-timeout=1s
remote-services.read-timeout=3s

# Kafka: PaymentSucceeded / PaymentFailed go out through the outbox table to the payment-events topic
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.admin.operation-timeout=10s
# order-events are read as the consumer group "payment-service" (cancelled orders close their payment link)
spring.kafka.consumer.group-id=payment-service
spring.kafka.consumer.auto-offset-reset=earliest
outbox.relay-interval=PT1S
outbox.retention=P7D

# Payments
# The public address of this service, for the URLs gateways send customers and webhooks back to. Locally the
# browser can reach localhost; a gateway's webhook needs a public address (a tunnel, or the deployment's URL)
payment.public-base-url=${PAYMENT_PUBLIC_BASE_URL:http://localhost:8085}
# How long a payment link can be paid (Razorpay needs at least 15 minutes, Stripe at least 30)
payment.link-validity=PT30M
# Which gateway a payment uses when the customer does not choose one; the others are tried if it fails
payment.default-gateway=${PAYMENT_DEFAULT_GATEWAY:RAZORPAY}
# How often unfinished payments are checked with their gateway, which is the source of truth
payment.reconciliation-interval=PT5M

# Razorpay, test mode keys only (rzp_test_...). Enabled when the key id is set
payment.razorpay.key-id=${RAZORPAY_KEY_ID:}
payment.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
payment.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

# Stripe, test mode keys only (sk_test_...). Enabled when the secret key is set
payment.stripe.secret-key=${STRIPE_SECRET_KEY:}
payment.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# A fake gateway for development and tests, with no account: its checkout page marks a payment paid or failed.
# Never enable it in a deployment: anyone could mark payments paid
payment.fake.enabled=${PAYMENT_FAKE_GATEWAY_ENABLED:false}
payment.fake.webhook-secret=${PAYMENT_FAKE_WEBHOOK_SECRET:fake-gateway-local-secret}

# Service discovery (Day 223). The service registers with Eureka as PAYMENT-SERVICE (spring.application.name)
# and finds the services it calls by name. Its address in the registry is its IP address, which also works inside
# Docker.
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
# The instance's status in Eureka follows its health: with its database down it is DOWN, and gets no traffic
eureka.client.healthcheck.enabled=true
# Only health and info are published; the other actuator endpoints (environment, heap dump) would give too much away
management.endpoints.web.exposure.include=health,info

# Heartbeat every 10 s, removed after missing them for 30 s (the defaults are 30 s and 90 s), a change of health
# reported within 10 s (default 30 s), and the registry read again every 10 s, as the load balancer's own copy
# (defaults 30 s and 35 s): a crashed or unhealthy instance is left out sooner, and a new or recovered one gets work
# sooner, for a few more small requests
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30
eureka.client.instance-info-replication-interval-seconds=10
eureka.client.registry-fetch-interval-seconds=10
spring.cloud.loadbalancer.cache.ttl=10s

# Until a crashed instance is removed, the load balancer can still pick it. A call that fails on the instance it chose
# is tried once more on another one (Spring Retry), so callers do not see the crash. Payment only reads the order
# from order-service.
spring.cloud.loadbalancer.retry.max-retries-on-same-service-instance=0
spring.cloud.loadbalancer.retry.max-retries-on-next-service-instance=1
