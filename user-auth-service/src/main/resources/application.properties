spring.application.name=user-auth-service

# 8081 locally, so it can run next to product-service (8080).
# In Docker or on AWS, the SERVER_PORT environment variable overrides it.
server.port=8081

# Database connection, read from environment variables (see .env.example).
# The defaults point at a local MySQL; a real password never goes in this file.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/user_db}
spring.datasource.username=${DB_USERNAME:UserAuthService_user}
spring.datasource.password=${DB_PASSWORD:}
# Wait at most 2 s for a database connection (Hikari's default is 30 s). When MySQL is unreachable, a request then
# gets 503 after about 2 s instead of 500 after 30 s, well within the API gateway's 10 s
spring.datasource.hikari.connection-timeout=2000
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway owns the schema: at startup it applies any new script in db/migration.
# Hibernate only checks that the tables match the entities, and stops the app if they don't.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# The Hibernate session closes when the service returns; lazy data cannot be loaded by accident in a controller
spring.jpa.open-in-view=false

# How long a login token stays valid (ISO-8601 duration). Logout ends it earlier.
auth.token-validity=PT10H

# RSA private key that signs every token (RS256), from the JWT_PRIVATE_KEY environment variable: a PKCS#8 PEM,
# e.g. from "openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048", or its Base64 on one line.
# Never put a real key in this file. Left empty, a key is generated at startup: local development only.
auth.jwt.private-key=${JWT_PRIVATE_KEY:}

# The issuer ("iss") of every token and the base of the OAuth2 / OpenID Connect discovery document.
# Behind the API gateway or on AWS, AUTH_ISSUER is the public URL clients use.
auth.issuer=${AUTH_ISSUER:http://localhost:8081}

# Password reset links (PRD 1.4): valid for 30 minutes, once. The emailed link is this address followed by the
# token; by default it opens this service's own page, and a web or mobile client can point it at its own
auth.password-reset.validity=PT30M
auth.password-reset.link=${PASSWORD_RESET_LINK:${auth.issuer}/auth/password-reset/confirm?token=}

# Where the OAuth2 authorization endpoint may send the "vanmool-web" client back with a code
# (127.0.0.1, not localhost, as OAuth 2.1 asks). The Postman callback makes the flow easy to try by hand.
auth.oauth2.web-client.redirect-uris=${WEB_CLIENT_REDIRECT_URIS:http://127.0.0.1:3000/callback,https://oauth.pstmn.io/v1/callback}

# Kafka (docker compose up -d kafka). Events go out through the outbox table; acks=all waits until the broker has
# stored each one. Short timeouts, so the relay notices quickly when Kafka is down and tries again a second later
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.admin.operation-timeout=10s
# How often the relay looks for unsent events, and how long sent ones are kept
outbox.relay-interval=PT1S
outbox.retention=P7D

# Service discovery (Day 223). The service registers with Eureka as USER-AUTH-SERVICE (spring.application.name)
# and finds the services it calls by name. Its address in the registry is its IP address, which also works inside
# Docker.
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
# The instance's status in Eureka follows its health: with its database down it is DOWN, and gets no traffic
eureka.client.healthcheck.enabled=true
# Only health and info are published; the other actuator endpoints (environment, heap dump) would give too much away
management.endpoints.web.exposure.include=health,info

# Heartbeat every 10 s, removed after missing them for 30 s (the defaults are 30 s and 90 s), a change of health
# reported within 10 s (default 30 s), and the registry read again every 10 s, as the load balancer's own copy
# (defaults 30 s and 35 s): a crashed or unhealthy instance is left out sooner, and a new or recovered one gets work
# sooner, for a few more small requests
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30
eureka.client.instance-info-replication-interval-seconds=10
eureka.client.registry-fetch-interval-seconds=10
spring.cloud.loadbalancer.cache.ttl=10s
