# Loaded on top of src/main/resources/application.properties, in tests only. The tests run without a Eureka server:
# the instances of each service are given by the tests themselves (Spring Cloud's simple discovery client).
eureka.client.enabled=false

# The user-events listener is off in tests: it would read the real topic as the real consumer group. The test that
# checks revoked tokens starts it with a group of its own
spring.kafka.listener.auto-startup=false
