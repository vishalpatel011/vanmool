# Every push and pull request: all unit and integration tests, and the Docker images of the eight services.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the run still going for the older one
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (unit and integration)
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    # The infrastructure the integration tests use locally from docker compose, as service containers here
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping --host=127.0.0.1 --silent"
          --health-interval 5s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
      kafka:
        image: apache/kafka:3.9.1
        ports: ["9092:9092"]
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s --health-timeout 10s --health-retries 15
      mailpit:
        image: axllent/mailpit:v1.27
        ports: ["1025:1025", "8025:8025"]

    env:
      # Throwaway passwords of a database that exists only for this run; every service user gets the same one, and
      # each service reads it as DB_PASSWORD
      DB_PASSWORD: ci-password
      PRODUCT_DB_PASSWORD: ci-password
      USER_DB_PASSWORD: ci-password
      ORDER_DB_PASSWORD: ci-password
      PAYMENT_DB_PASSWORD: ci-password

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Create the services' databases and users
        run: >-
          docker run --rm --network host
          -e MYSQL_HOST=127.0.0.1 -e MYSQL_ADMIN_USER=root -e MYSQL_ADMIN_PASSWORD=ci-root-password
          -e PRODUCT_DB_PASSWORD -e USER_DB_PASSWORD -e ORDER_DB_PASSWORD -e PAYMENT_DB_PASSWORD
          -v "$PWD/infrastructure/mysql/init:/init:ro" mysql:8.4 bash /init/create-databases.sh

      - name: Build, unit tests and integration tests
        run: ./mvnw -B -ntp verify

      - name: Keep the test reports of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            */target/surefire-reports/
            */target/failsafe-reports/
          retention-days: 7

  docker-images:
    name: Docker images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build the eight images
        run: docker compose --profile app build
