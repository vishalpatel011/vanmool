# Local infrastructure for development: docker compose up -d
# MySQL runs outside Docker for now (see README); the services themselves join this file when they are containerized.
services:
  redis:
    image: redis:7.4-alpine
    # appendonly: every change is also written to a log on disk (flushed once a second), so carts, which live only
    # in Redis, survive a restart of the container. The product cache would not need it: it is refilled from MySQL.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # Reachable from this machine only, not from the network
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # One Kafka broker in KRaft mode: it is its own controller, so no ZooKeeper is needed
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # The address clients are told to use. Services in containers will need a second listener (Docker step)
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # One broker, so every internal topic has one copy
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are declared by the services that own them, never created by a typo in a topic name
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 10

  # A mail catcher for development: accepts every email over SMTP (port 1025) and shows it in a web page
  # (http://localhost:8025) instead of delivering it. On AWS the same SMTP settings point at Amazon SES.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  redis-data:
  kafka-data:
