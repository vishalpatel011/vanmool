spring.application.name=api-gateway

# The address clients use. In Docker or on AWS, the SERVER_PORT environment variable overrides it.
server.port=8000

# Routes: the request's path decides the service; lb:// picks one of its instances from Eureka (round robin).
# Only the public API is routed. Internal endpoints, such as the stock reservations that order-service makes with
# product-service, are not: from outside they answer 404. The OAuth2 / OpenID Connect endpoints of user-auth-service
# (/oauth2, /.well-known, its sign-in page) are used at its own address, which is also the tokens' issuer.
spring.cloud.gateway.server.webflux.routes[0].id=user-auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://user-auth-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**,/users/**

spring.cloud.gateway.server.webflux.routes[1].id=product-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://product-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/products/**,/categories/**

spring.cloud.gateway.server.webflux.routes[2].id=cart-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://cart-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/cart/**

spring.cloud.gateway.server.webflux.routes[3].id=order-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://order-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/orders/**,/admin/orders/**

# Webhooks and the browser's return from a payment gateway come here too; the fake gateway's pages only exist where
# payment-service has it switched on (development)
spring.cloud.gateway.server.webflux.routes[4].id=payment-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://payment-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/payments/**,/fake-gateway/**

# A GET whose instance cannot be reached (crashed, not yet removed from the registry) is tried once more, on the next
# instance. Only connection failures: a service's own error answer is passed on as it is
spring.cloud.gateway.server.webflux.default-filters[0].name=Retry
spring.cloud.gateway.server.webflux.default-filters[0].args.retries=1
spring.cloud.gateway.server.webflux.default-filters[0].args.methods=GET
spring.cloud.gateway.server.webflux.default-filters[0].args.series=
spring.cloud.gateway.server.webflux.default-filters[0].args.exceptions=java.net.ConnectException

# Time limits for the calls to the services: 1 s to connect, 10 s for the answer (starting a payment calls a gateway)
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=1000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=10s

# Service discovery, as in the services: registered as API-GATEWAY, the registry read every 10 s
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30
eureka.client.registry-fetch-interval-seconds=10
spring.cloud.loadbalancer.cache.ttl=10s

management.endpoints.web.exposure.include=health,info
