spring.application.name=product-service

# 8080 locally, next to user-auth-service (8081), cart-service (8082) and order-service (8083). Set explicitly so the
# instance id in Eureka (host:name:port) tells two instances on one machine apart. SERVER_PORT overrides it.
server.port=8080

# Database connection, read from environment variables (see .env.example).
# The defaults point at a local MySQL; a real password never goes in this file.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/product_db}
spring.datasource.username=${DB_USERNAME:ProductService_user}
spring.datasource.password=${DB_PASSWORD:}
# Wait at most 2 s for a database connection (Hikari's default is 30 s). When MySQL is unreachable, a request then
# gets 503 after about 2 s instead of 500 after 30 s, well within the API gateway's 10 s
spring.datasource.hikari.connection-timeout=2000
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway owns the schema: at startup it applies any new script in db/migration.
# Hibernate only checks that the tables match the entities, and stops the app if they don't.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Close the Hibernate session when the service returns, instead of keeping it open until the response is written.
# Lazy data can then not be loaded by accident in the controller (one hidden query per item); a query that misses
# an @EntityGraph fails loudly with LazyInitializationException instead.
spring.jpa.open-in-view=false

# Paging: a client asks for at most 100 products per page; a page is sent as
# { "content": [...], "page": { "size", "number", "totalElements", "totalPages" } }, a format that stays stable
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.serialization-mode=via-dto

# Redis: the product cache (docker compose up -d redis). Short timeouts, because when Redis is unreachable each request
# waits this long before CacheConfig's error handler falls back to MySQL
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.connect-timeout=500ms
spring.data.redis.timeout=500ms
# How long a cached product is kept at most (ISO-8601 duration). Changes through the API remove it at once
product.cache.time-to-live=${PRODUCT_CACHE_TTL:PT10M}

# Kafka (docker compose up -d kafka): this service reads order-events as the consumer group "product-service".
# earliest: a group that starts for the first time reads the topic from its beginning, so no event is skipped.
# Offsets are committed after an event has been handled, so an event is never marked done before it was
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=product-service
spring.kafka.consumer.auto-offset-reset=earliest
# The producer only sends failed events to the dead-letter topic
spring.kafka.producer.acks=all
spring.kafka.admin.operation-timeout=10s

# Service discovery (Day 223). The service registers with Eureka as PRODUCT-SERVICE (spring.application.name)
# and finds the services it calls by name. Its address in the registry is its IP address, which also works inside
# Docker.
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
# The instance's status in Eureka follows its health: with its database down it is DOWN, and gets no traffic
eureka.client.healthcheck.enabled=true
# Only health and info are published; the other actuator endpoints (environment, heap dump) would give too much away
management.endpoints.web.exposure.include=health,info
# Redis is only this service's cache, and it works on without it (CacheConfig), so Redis being down must not
# make the instance DOWN
management.health.redis.enabled=false
# Heartbeat every 10 s, removed after missing them for 30 s (the defaults are 30 s and 90 s), a change of health
# reported within 10 s (default 30 s), and the registry read again every 10 s, as the load balancer's own copy
# (defaults 30 s and 35 s): a crashed or unhealthy instance is left out sooner, and a new or recovered one gets work
# sooner, for a few more small requests
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30
eureka.client.instance-info-replication-interval-seconds=10
eureka.client.registry-fetch-interval-seconds=10
spring.cloud.loadbalancer.cache.ttl=10s

# Tokens come from user-auth-service. The issuer is checked; the public keys are fetched from user-auth-service by its
# service name, through Eureka (JwtDecoderConfig), and kept for 5 minutes, not fetched for every request
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER:http://localhost:8081}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWKS_URI:http://user-auth-service/oauth2/jwks}
