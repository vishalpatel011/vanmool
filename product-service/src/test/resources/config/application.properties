# Loaded on top of src/main/resources/application.properties, in tests only (Spring Boot reads config/ after the
# classpath root). The tests run without a Eureka server: no registration, and no registry to fetch.
eureka.client.enabled=false

# The Eureka client puts Apache HttpClient 5 on the classpath, and Spring would then use it for the test clients
# (TestRestTemplate) too: a connection pool of 5 per host that waits up to 3 minutes for a free connection. The tests
# use the JDK's HttpClient, as before; the services' own clients set their HTTP client explicitly
spring.http.client.factory=jdk

# No Ollama in tests: the catalog index is not built at startup (the assistants' tests use stand-in models)
assistant.index-on-startup=false
