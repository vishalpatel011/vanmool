spring.application.name=api-gateway

# The address clients use. In Docker or on AWS, the SERVER_PORT environment variable overrides it.
server.port=8000

# Routes: the request's path decides the service; lb:// picks one of its instances from Eureka (round robin).
# Only the public API is routed. Internal endpoints, such as the stock reservations that order-service makes with
# product-service, are not: from outside they answer 404. The OAuth2 / OpenID Connect endpoints of user-auth-service
# (/oauth2, /.well-known, its sign-in page) are used at its own address, which is also the tokens' issuer.
# Signing in, signing up and asking for or using a password reset link: at most 10 a minute from one client address,
# across the four (a token bucket of 60 that refills by 1 a second, each request taking 6). This slows down password
# guessing and stops a stranger from flooding someone's mailbox. Over the limit: 429 Too Many Requests. Only POSTs:
# the page a reset link opens is not limited. First, so these requests do not reach the general route below
spring.cloud.gateway.server.webflux.routes[0].id=user-auth-sign-in
spring.cloud.gateway.server.webflux.routes[0].uri=lb://user-auth-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/login,/auth/signup,/auth/password-reset,/auth/password-reset/confirm
spring.cloud.gateway.server.webflux.routes[0].predicates[1]=Method=POST
spring.cloud.gateway.server.webflux.routes[0].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.redis-rate-limiter.replenishRate=1
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.redis-rate-limiter.burstCapacity=60
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.redis-rate-limiter.requestedTokens=6
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.key-resolver=#{@clientAddressKeyResolver}

spring.cloud.gateway.server.webflux.routes[1].id=user-auth-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://user-auth-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/auth/**,/users/**

spring.cloud.gateway.server.webflux.routes[2].id=product-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://product-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/products/**,/categories/**

spring.cloud.gateway.server.webflux.routes[3].id=cart-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://cart-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/cart/**

spring.cloud.gateway.server.webflux.routes[4].id=order-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://order-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/orders/**,/admin/orders/**

# Webhooks and the browser's return from a payment gateway come here too; the fake gateway's pages only exist where
# payment-service has it switched on (development)
spring.cloud.gateway.server.webflux.routes[5].id=payment-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://payment-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/payments/**,/fake-gateway/**

# The listing and shopping assistants call a language model, which can take a minute on a CPU: a longer answer timeout than the
# 10 s of every other route, and the same limit per client address as signing in, because each request costs seconds
# of model time. Order -1: matched before the product-service route below
spring.cloud.gateway.server.webflux.routes[11].id=product-assistants
spring.cloud.gateway.server.webflux.routes[11].uri=lb://product-service
spring.cloud.gateway.server.webflux.routes[11].order=-1
spring.cloud.gateway.server.webflux.routes[11].predicates[0]=Path=/products/listing-drafts,/assistant/**
spring.cloud.gateway.server.webflux.routes[11].metadata.response-timeout=120000
spring.cloud.gateway.server.webflux.routes[11].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[11].filters[0].args.redis-rate-limiter.replenishRate=1
spring.cloud.gateway.server.webflux.routes[11].filters[0].args.redis-rate-limiter.burstCapacity=60
spring.cloud.gateway.server.webflux.routes[11].filters[0].args.redis-rate-limiter.requestedTokens=6
spring.cloud.gateway.server.webflux.routes[11].filters[0].args.key-resolver=#{@clientAddressKeyResolver}

# Each service's OpenAPI description, for the Swagger page below. Not under /v3/api-docs/..., where the gateway's
# own springdoc answers
spring.cloud.gateway.server.webflux.routes[6].id=api-docs-product-service
spring.cloud.gateway.server.webflux.routes[6].uri=lb://product-service
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api-docs/product-service
spring.cloud.gateway.server.webflux.routes[6].filters[0]=SetPath=/v3/api-docs
spring.cloud.gateway.server.webflux.routes[7].id=api-docs-user-auth-service
spring.cloud.gateway.server.webflux.routes[7].uri=lb://user-auth-service
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/api-docs/user-auth-service
spring.cloud.gateway.server.webflux.routes[7].filters[0]=SetPath=/v3/api-docs
spring.cloud.gateway.server.webflux.routes[8].id=api-docs-cart-service
spring.cloud.gateway.server.webflux.routes[8].uri=lb://cart-service
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/api-docs/cart-service
spring.cloud.gateway.server.webflux.routes[8].filters[0]=SetPath=/v3/api-docs
spring.cloud.gateway.server.webflux.routes[9].id=api-docs-order-service
spring.cloud.gateway.server.webflux.routes[9].uri=lb://order-service
spring.cloud.gateway.server.webflux.routes[9].predicates[0]=Path=/api-docs/order-service
spring.cloud.gateway.server.webflux.routes[9].filters[0]=SetPath=/v3/api-docs
spring.cloud.gateway.server.webflux.routes[10].id=api-docs-payment-service
spring.cloud.gateway.server.webflux.routes[10].uri=lb://payment-service
spring.cloud.gateway.server.webflux.routes[10].predicates[0]=Path=/api-docs/payment-service
spring.cloud.gateway.server.webflux.routes[10].filters[0]=SetPath=/v3/api-docs

# One Swagger page for the whole API, http://<gateway>/swagger-ui.html, with a choice of service. "Try it out" sends
# the requests through this gateway
springdoc.swagger-ui.urls[0].name=product-service
springdoc.swagger-ui.urls[0].url=/api-docs/product-service
springdoc.swagger-ui.urls[1].name=user-auth-service
springdoc.swagger-ui.urls[1].url=/api-docs/user-auth-service
springdoc.swagger-ui.urls[2].name=cart-service
springdoc.swagger-ui.urls[2].url=/api-docs/cart-service
springdoc.swagger-ui.urls[3].name=order-service
springdoc.swagger-ui.urls[3].url=/api-docs/order-service
springdoc.swagger-ui.urls[4].name=payment-service
springdoc.swagger-ui.urls[4].url=/api-docs/payment-service
springdoc.swagger-ui.urls-primary-name=product-service

# A GET that got no answer is tried once more, on the next instance: its instance could not be reached (crashed, not
# yet removed from the registry), or the connection was closed before the answer (the service closed a kept-alive
# connection just as the gateway sent the request on it). A GET changes nothing, so sending it again is safe. A
# service's own error answer is passed on as it is
spring.cloud.gateway.server.webflux.default-filters[0].name=Retry
spring.cloud.gateway.server.webflux.default-filters[0].args.retries=1
spring.cloud.gateway.server.webflux.default-filters[0].args.methods=GET
spring.cloud.gateway.server.webflux.default-filters[0].args.series=
spring.cloud.gateway.server.webflux.default-filters[0].args.exceptions=java.net.ConnectException,reactor.netty.http.client.PrematureCloseException

# Time limits for the calls to the services: 1 s to connect, 10 s for the answer (starting a payment calls a gateway)
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=1000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=10s
# Kept-alive connections to the services are closed by the gateway after 15 s without use. The services' Tomcat closes
# them after 60 s; a connection the gateway picks just as Tomcat closes it fails before any answer
spring.cloud.gateway.server.webflux.httpclient.pool.max-idle-time=15s

# Redis holds the rate limit counters. If it is down, requests are let through (the limiter fails open) rather than
# all refused, and the gateway stays healthy: its health leaves Redis out
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.connect-timeout=500ms
spring.data.redis.timeout=500ms
management.health.redis.enabled=false

# Kafka (docker compose up -d kafka): the gateway reads user-events as the consumer group "api-gateway", from the
# beginning on its first start, to learn which tokens were ended before their expiry (RevokedTokenFilter)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=api-gateway
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.acks=all
spring.kafka.admin.operation-timeout=10s

# Service discovery, as in the services: registered as API-GATEWAY, the registry read every 10 s
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30
eureka.client.registry-fetch-interval-seconds=10
spring.cloud.loadbalancer.cache.ttl=10s

management.endpoints.web.exposure.include=health,info
