spring.application.name=service-discovery

# 8761 is Eureka's usual port. In Docker or on AWS, the SERVER_PORT environment variable overrides it.
server.port=8761

# This is the registry itself: it does not register with, or read from, another Eureka server.
# Several registries that copy each other (peers) would remove this single point of failure; one is enough here,
# and the services keep their last copy of the registry if it goes down.
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Self-preservation: when many instances miss their heartbeats at once, Eureka assumes a network problem and stops
# removing instances. With the few instances of a local run, that mostly keeps instances that were just stopped, so it
# is off by default; turn it on (EUREKA_SELF_PRESERVATION=true) where many instances run.
eureka.server.enable-self-preservation=${EUREKA_SELF_PRESERVATION:false}

# Only the health check is published (for a container's health check), not the other actuator endpoints
management.endpoints.web.exposure.include=health

# How fast a crashed instance disappears. It is removed when it misses its heartbeats for the lease time, and Eureka
# counts that time twice; the removal check runs every 10 s instead of every 60 s, and the answers to the services are
# cached for 10 s instead of 30 s.
# The services send a heartbeat every 10 s (their eureka.instance settings); the expected rate must match it for
# self-preservation, if it is turned on
eureka.server.eviction-interval-timer-in-ms=10000
eureka.server.response-cache-update-interval-ms=10000
eureka.server.expected-client-renewal-interval-seconds=10
