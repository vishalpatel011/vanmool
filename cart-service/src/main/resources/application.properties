spring.application.name=cart-service

# 8082 locally, next to product-service (8080) and user-auth-service (8081).
# In Docker or on AWS, the SERVER_PORT environment variable overrides it.
server.port=8082

# Redis holds the carts (docker compose up -d redis). Short timeouts: a request should fail quickly with 503
# rather than hang when Redis is unreachable
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.connect-timeout=500ms
spring.data.redis.timeout=500ms

# A cart is deleted after this long without a change (ISO-8601 duration); every change starts the period again
cart.time-to-live=${CART_TTL:P30D}

# Tokens come from user-auth-service. Each one is checked here, without calling user-auth-service: the signature
# against its public keys (fetched once from the JWKS URL, then cached), the issuer, and the expiry.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER:http://localhost:8081}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWKS_URI:http://localhost:8081/oauth2/jwks}

# product-service, asked for the current name and price of each product in a cart
product-service.url=${PRODUCT_SERVICE_URL:http://localhost:8080}
product-service.connect-timeout=1s
product-service.read-timeout=2s
