spring.application.name=notification-service

# Kafka (docker compose up -d kafka): reads user-events and order-events as the consumer group
# "notification-service". earliest: a group that starts for the first time reads the topics from their beginning
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
# The producer only sends events that could not be handled to the dead-letter topics
spring.kafka.producer.acks=all
spring.kafka.admin.operation-timeout=10s

# SMTP server. Locally Mailpit (docker compose up -d mailpit), which keeps every email and shows it at
# http://localhost:8025. On AWS: Amazon SES's SMTP endpoint, with MAIL_USERNAME/MAIL_PASSWORD, auth and STARTTLS on.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
notification.mail.from=${MAIL_FROM:Vanmool <orders@vanmool.example>}

# Redis remembers the ids of handled events for 7 days (keys notification:event:{eventId})
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.connect-timeout=500ms
spring.data.redis.timeout=500ms
notification.handled-events.time-to-live=P7D
