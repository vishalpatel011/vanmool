# Local infrastructure for development: docker compose up -d starts Redis, Kafka and Mailpit.
# The services run outside Docker then (IntelliJ, ./mvnw), with the MySQL installed on this machine.
# The profile "app" adds what the containerized stack needs: docker compose --profile app up -d
services:
  # The services' databases for the containerized stack: one server, a database and a user per service, created by
  # infrastructure/mysql/init on the first start. MySQL 8.4 is the long-term support release (8.0 ended in April 2026)
  mysql:
    image: mysql:8.4
    profiles: ["app"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
      PRODUCT_DB_PASSWORD: ${PRODUCT_DB_PASSWORD:-}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:-}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:-}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:-}
    ports:
      # For a database client on this machine; the services use mysql:3306 inside the network.
      # 3307, because a MySQL installed on this machine usually has 3306
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infrastructure/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP: while the init scripts run, MySQL accepts only local socket connections, so this stays unhealthy
      # until the databases and users exist
      test: ["CMD", "mysqladmin", "ping", "--host=127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    # appendonly: every change is also written to a log on disk (flushed once a second), so carts, which live only
    # in Redis, survive a restart of the container. The product cache would not need it: it is refilled from MySQL.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # Reachable from this machine only, not from the network
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # One Kafka broker in KRaft mode: it is its own controller, so no ZooKeeper is needed
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two addresses for clients: localhost:9092 for services running on this machine, kafka:29092 for services in
      # containers. A client first asks any address for the broker list, then connects to the address advertised for
      # the listener it came in on, so each kind of client is told an address it can reach
      KAFKA_LISTENERS: PLAINTEXT://:9092,DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # One broker, so every internal topic has one copy
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are declared by the services that own them, never created by a typo in a topic name
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Topics and events are kept in the kafka-data volume, so they survive a new container. Without this setting
      # Kafka writes to /tmp/kafka-logs inside the container, which is lost when the container is recreated
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 10

  # A mail catcher for development: accepts every email over SMTP (port 1025) and shows it in a web page
  # (http://localhost:8025) instead of delivering it. On AWS the same SMTP settings point at Amazon SES.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  mysql-data:
  redis-data:
  kafka-data:
